# Reusable confidentiality gate (design doc §4 L1). Called by every public repo
# as a required status check. Runs the shared scan engine in the right mode for
# the caller's event, with a pinned+cached+sha256-verified gitleaks (tier 1),
# public shape patterns (tier 2), and the org-secret hashed denylist (tier 3).
#
# Fail-closed: a same-repo run without the denylist secret HARD-FAILS when enforcing
# (require_denylist=true, the default); a fork PR runs tiers 1+2 in a visible DEGRADED
# mode (never fails open silently). During BURN-IN a caller may pass
# require_denylist=false to degrade the same-repo path to tiers 1+2 + a WARNING
# instead of failing closed — see the `require_denylist` input. Findings are masked
# by the engine (no matched literal / no digest); `::add-mask::` is emitted before
# any finding line.
#
# Caller usage: see README "Confidentiality gate — caller usage".
name: confidentiality-gate

on:
  workflow_call:
    inputs:
      engine_sha:
        description: >-
          Immutable 40-hex commit SHA of the-metafactory/metafactory-actions to load
          the scan ENGINE from. MUST equal the SHA the caller pins THIS reusable at in
          `uses: ...@<sha>`, so the engine stays byte-matched to the gate (M-8). Required
          because `github.job_workflow_sha` is EMPTY on cross-repo caller runs, so it is
          not a reliable immutability anchor — this explicit pin is. Validated as 40-hex
          and fail-closed if it is not (a movable branch/tag ref must never select the
          engine). Only a metafactory-actions SHA is honoured; the engine repository is
          hardcoded, never a caller input.
        type: string
        required: true
      mode:
        description: "diff | tree | history | auto (auto ⇒ pull_request→diff, push→tree, schedule/dispatch→history)"
        type: string
        required: false
        default: "auto"
      gitleaks_version:
        type: string
        required: false
        default: "8.18.4"
      gitleaks_sha256:
        description: "sha256 of gitleaks_<ver>_linux_x64.tar.gz (verified before use; mismatch ⇒ tier 1 skipped, never a tampered run)"
        type: string
        required: false
        default: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
      require_denylist:
        description: "Fail closed when the tier-3 denylist secret is absent/empty on the trusted same-repo path. Set false ONLY during burn-in to degrade to tiers 1+2 + warn; leave true (default) when enforcing."
        type: boolean
        required: false
        default: true
    secrets:
      MF_CONFIDENTIALITY_DENYLIST:
        description: "Salted-SHA-256 hashed denylist (org secret, selected public repos). Absent on fork PRs ⇒ degraded."
        required: false
      CONF_DENYLIST_PEPPER:
        description: "Optional 2nd denylist secret; must match whatever built the denylist."
        required: false

permissions:
  contents: read

jobs:
  confidentiality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin the ENGINE to an IMMUTABLE metafactory-actions commit SHA. The reliable
      # source is the explicit `engine_sha` input: the caller sets it to the SAME
      # 40-hex SHA it pins THIS reusable at in `uses: ...@<sha>`, so the engine is
      # byte-matched to the gate. `github.job_workflow_sha` was the old primary source
      # but it resolves EMPTY on real cross-repo caller runs (a GitHub reusable-workflow
      # limitation), which failed the gate closed at step 1 on every caller — the gate
      # never scanned. It is kept only as a belt-and-suspenders fallback for the case
      # where the input is somehow missing/malformed but GitHub DID populate it.
      # Immutability (M-8) is preserved either way: the resolved value MUST be 40-hex,
      # so a movable branch/tag ref can never select the engine, and the engine
      # repository is hardcoded below (a caller can only pin a metafactory-actions SHA,
      # never point the checkout elsewhere).
      - name: Resolve engine SHA (immutable)
        env:
          ENGINE_SHA_INPUT: ${{ inputs.engine_sha }}
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          SHA=""
          IN="${ENGINE_SHA_INPUT:-}"
          if printf '%s' "$IN" | grep -qE '^[0-9a-f]{40}$'; then
            SHA="$IN"
            echo "::notice::confidentiality-gate engine SHA = $SHA (immutable; source=engine_sha input)"
          else
            # Belt-and-suspenders: the input is required, but if it arrives empty or
            # malformed AND GitHub happened to populate job_workflow_sha with a valid
            # 40-hex, fall back to that rather than failing. Both paths enforce 40-hex.
            JWS="${JOB_WORKFLOW_SHA:-}"
            if printf '%s' "$JWS" | grep -qE '^[0-9a-f]{40}$'; then
              SHA="$JWS"
              echo "::warning::confidentiality-gate: engine_sha input '${IN}' is not a 40-hex commit SHA; falling back to github.job_workflow_sha. Pass engine_sha=<the metafactory-actions SHA you pin uses:@ at> for a reliable pin."
              echo "::notice::confidentiality-gate engine SHA = $SHA (immutable; source=job_workflow_sha fallback)"
            else
              echo "::error::confidentiality-gate: engine_sha input '${IN}' is not a 40-hex commit SHA and github.job_workflow_sha is empty. A branch/tag ref is movable and MUST NOT select the engine. Set engine_sha to the SAME 40-hex SHA you pin this reusable at in uses:@<sha>. Failing closed."
              exit 1
            fi
          fi
          echo "ENGINE_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Checkout scan engine (metafactory-actions @ immutable SHA)
        uses: actions/checkout@v4
        with:
          repository: the-metafactory/metafactory-actions
          ref: ${{ env.ENGINE_SHA }}
          path: _scan_engine
          persist-credentials: false

      - name: Caller integrity (advisory SHA-pin check)
        run: |
          set -euo pipefail
          HITS="$(grep -RIl "metafactory-actions/.github/workflows/confidentiality-gate.yml" .github/workflows 2>/dev/null || true)"
          # shellcheck disable=SC2086  # $HITS is an intentional space-separated file list
          if [ -z "$HITS" ]; then
            echo "::warning::caller integrity: no reference to the reusable confidentiality-gate found in .github/workflows (unexpected)"
          elif grep -RhoE "metafactory-actions/.github/workflows/confidentiality-gate.yml@[0-9a-f]{40}" $HITS >/dev/null 2>&1; then
            echo "::notice::caller integrity: gate is pinned by commit SHA ✓"
          else
            echo "::warning::caller integrity: the gate reference is NOT pinned by a 40-hex commit SHA — pin it (SOP) to close the check-name-spoof / floating-ref vector."
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Key the cache on version + the EXPECTED sha256 so a differently-hashed
      # payload lands in a different namespace. Integrity does NOT rely on the key,
      # though — the setup step re-verifies the tarball on every run, incl. cache
      # restores (H-4).
      - name: Cache gitleaks
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gitleaks
          key: gitleaks-${{ inputs.gitleaks_version }}-${{ inputs.gitleaks_sha256 }}-linux-x64

      - name: Setup gitleaks (pinned + sha256-verified on EVERY run, incl. cache restore)
        env:
          GL_VER: ${{ inputs.gitleaks_version }}
          GL_SHA: ${{ inputs.gitleaks_sha256 }}
        run: |
          set -uo pipefail
          GL_DIR="${{ runner.temp }}/gitleaks"
          BIN="$GL_DIR/gitleaks"
          TARBALL="$GL_DIR/gitleaks.tar.gz"
          mkdir -p "$GL_DIR"

          # Download the tarball only if it isn't already present (a cache restore
          # brings it back). The binary is NOT trusted on presence — it is always
          # re-derived from a re-verified tarball below.
          if [ ! -f "$TARBALL" ]; then
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
            if ! curl -sSL --retry 3 --retry-delay 2 --max-time 60 -o "$TARBALL" "$URL"; then
              echo "::warning::gitleaks download failed (flake) — tier 1 skipped; tiers 2+3 still gate"
              rm -f "$BIN"; exit 0
            fi
          fi

          # ALWAYS verify the tarball's sha256 — whether freshly downloaded OR
          # restored from cache. A poisoned cache entry (swapped tarball) fails here
          # and tier 1 is skipped rather than run unverified (H-4).
          if ! echo "${GL_SHA}  ${TARBALL}" | sha256sum -c - ; then
            echo "::warning::gitleaks sha256 MISMATCH for v${GL_VER} — refusing to run an unverified/poisoned binary; tier 1 skipped (tiers 2+3 still gate)"
            rm -f "$TARBALL" "$BIN"; exit 0
          fi

          # Re-extract from the verified tarball every run — overwrites any tampered
          # binary a poisoned cache may have carried alongside a valid tarball.
          if ! tar -xzf "$TARBALL" -C "$GL_DIR" gitleaks; then
            echo "::warning::gitleaks extract failed — tier 1 skipped"; rm -f "$BIN"; exit 0
          fi

          if [ -x "$BIN" ]; then
            echo "MF_GITLEAKS_BIN=$BIN" >> "$GITHUB_ENV"
            echo "$GL_DIR" >> "$GITHUB_PATH"
          fi

      # Classify this run: fork/same-repo × denylist-state × require_denylist. The
      # branch logic is security-critical and lives in ONE executed file
      # (scan/gate-policy.sh) so it cannot drift between this YAML and its test
      # (scan/gate-policy.test.ts). The classifier ships in the engine bundle checked
      # out above (_scan_engine @ the immutable ENGINE_SHA), so it is byte-pinned to
      # the gate. It appends GATE_DECISION (full|degraded) to $GITHUB_ENV for the scan
      # step, or exits 1 to FAIL CLOSED (same-repo + absent/empty denylist + enforce).
      # A present-but-empty secret ({"salt":"","entries":[]}) is classified 'empty',
      # never 'valid' — tier 3 can't run silently INERT and ship green (re-review F2).
      - name: Gate policy (fail-closed on same-repo missing/empty denylist; degrade in burn-in)
        env:
          DENYLIST: ${{ secrets.MF_CONFIDENTIALITY_DENYLIST }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          REQUIRE_DENYLIST: ${{ inputs.require_denylist }}
          POLICY_SH: ${{ github.workspace }}/_scan_engine/scan/gate-policy.sh
        run: |
          set -euo pipefail
          bash "$POLICY_SH"

      - name: Determine scan mode
        env:
          MODE_IN: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Refuse pull_request_target: it exposes org secrets to fork-authored PRs
          # AND checks out the BASE tree by default (so the PR's changes go unscanned)
          # — a fail-open + secret-exposure footgun. Use pull_request only (M-9).
          if [ "$EVENT" = "pull_request_target" ]; then
            echo "::error::confidentiality-gate: pull_request_target is not supported (secret exposure to fork head + base-tree checkout ⇒ fail-open). Wire the gate on 'pull_request'. Failing closed."
            exit 1
          fi
          MODE="$MODE_IN"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            case "$EVENT" in
              pull_request) MODE="diff" ;;
              push) MODE="tree" ;;
              schedule|workflow_dispatch) MODE="history" ;;
              *) MODE="tree" ;;
            esac
          fi
          echo "SCAN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "::notice::confidentiality-gate mode=$MODE (event=$EVENT)"

      # Fetch the PR base and PROVE the diff range is trustworthy before the scan.
      # A silently-empty or errored diff must never be read as "clean" (CONFIRMED-3).
      - name: Fetch + verify PR base (diff mode)
        if: ${{ env.SCAN_MODE == 'diff' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::confidentiality-gate: diff mode but github.base_ref is empty — cannot compute a trustworthy PR diff. Failing closed."
            exit 1
          fi
          # No `|| true`: a failed fetch now fails the job (set -e).
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
            echo "::error::confidentiality-gate: base ref origin/${BASE_REF} did not resolve after fetch — refusing to scan an empty/partial diff. Failing closed."
            exit 1
          fi
          # If GitHub says this PR changes files, the scan range MUST reflect that.
          # A range that resolves 0 files while changed_files>0 means we'd 'pass'
          # having scanned nothing — fail closed instead.
          CHANGED="${PR_CHANGED_FILES:-0}"
          case "$CHANGED" in ''|*[!0-9]*) CHANGED=0 ;; esac
          if [ "$CHANGED" -gt 0 ]; then
            RANGE_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -c . || true)"
            if [ "${RANGE_FILES:-0}" -eq 0 ]; then
              echo "::error::confidentiality-gate: PR reports ${CHANGED} changed file(s) but scan range origin/${BASE_REF}...HEAD resolved 0 files — refusing to report clean on an empty diff. Failing closed."
              exit 1
            fi
            echo "::notice::confidentiality-gate diff range covers ${RANGE_FILES} file(s) (PR changed_files=${CHANGED})"
          fi

      # Run the interpreter from a TRUSTED, clean directory (runner.temp) — NEVER
      # from the caller workspace. `bun` auto-loads `bunfig.toml` (and its `preload`
      # → arbitrary code execution) from its process CWD; with CWD inside the
      # attacker-controlled checkout, a PR that adds a root `bunfig.toml` would run
      # code in this secret-bearing job. bun does not walk parent dirs for bunfig, so
      # a clean CWD + absolute engine path fully closes it (CONFIRMED-1). The engine
      # scans the caller tree via `--cwd "$WORKSPACE"` (drives every git/file op),
      # while bun's own CWD stays trusted. `--gitleaks-config` pins a trusted gitleaks
      # config so an in-tree `.gitleaks.toml` can't disable tier 1 (CONFIRMED-2), and
      # `--require-denylist` (the FULL path only — same-repo + valid denylist, per the
      # Gate policy classification GATE_DECISION=full) fails closed on a present-but-empty
      # denylist payload (M-5). `--gitleaks-config`/`--require-denylist` land with the
      # engine in #9; `--cwd` already exists.
      - name: Run confidentiality scan
        working-directory: ${{ runner.temp }}
        env:
          # Secrets → env (never interpolated into the script body).
          MF_CONFIDENTIALITY_DENYLIST: ${{ secrets.MF_CONFIDENTIALITY_DENYLIST }}
          CONF_DENYLIST_PEPPER: ${{ secrets.CONF_DENYLIST_PEPPER }}
          # Attacker-controllable PR metadata → env only (avoids script injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ENGINE="$WORKSPACE/_scan_engine/scan/confidentiality-scan.ts"
          PATTERNS="$WORKSPACE/_scan_engine/scan/public-patterns.yaml"
          GITLEAKS_CONFIG="$WORKSPACE/_scan_engine/scan/gitleaks.toml"
          # Scan the caller tree by explicit path (--cwd); bun's process CWD stays
          # trusted (runner.temp), so a workspace-root bunfig.toml cannot run.
          ARGS=("$SCAN_MODE" --cwd "$WORKSPACE" --patterns "$PATTERNS" --gitleaks-config "$GITLEAKS_CONFIG")
          # Enforce tier 3 (--require-denylist) ONLY on the FULL path — same-repo with a
          # valid denylist, as classified by the Gate policy step (GATE_DECISION=full).
          # There a present-but-empty secret fails closed instead of running tier 3 inert
          # (M-5). The 'degraded' path — fork PRs OR same-repo burn-in (require_denylist=
          # false) — runs tiers 1+2 with tier 3 legitimately off, so it MUST NOT require it.
          if [ "${GATE_DECISION:-}" = "full" ]; then
            ARGS+=(--require-denylist)
          fi
          if [ "$SCAN_MODE" = "diff" ]; then
            ARGS+=(--range "origin/${BASE_REF}...HEAD")
            [ -n "${PR_TITLE:-}" ] && ARGS+=(--extra-text "$PR_TITLE")
            [ -n "${PR_BODY:-}" ] && ARGS+=(--extra-text "$PR_BODY")
            [ -n "${HEAD_BRANCH:-}" ] && ARGS+=(--extra-text "$HEAD_BRANCH")
          fi
          echo "running (cwd=$PWD, trusted): bun $ENGINE ${ARGS[*]}"
          bun "$ENGINE" "${ARGS[@]}"
